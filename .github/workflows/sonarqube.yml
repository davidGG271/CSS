name: SonarQube Cloud Analysis
on:
  push:
    branches:
      - main
      - master
      - cyc-computer
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # (Opcional) Instalar dependencias y ejecutar pruebas del backend para obtener cobertura
      - name: Install dependencies and run tests (Backend)
        run: |
          cd backend-apps
          npm ci
          npm run test:cov || echo "Pruebas de backend fallaron, continuando con el análisis..."
        continue-on-error: true

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
